<style>html, body, #root { margin: 0; min-height: 100%; }
body { background: #120a24; }
.wf-root { position: relative; min-height: 100%; background: linear-gradient(180deg,#1b0f3a 0%,#120a24 60%,#0b1a2e 100%); color: #f5efff; font-family: 'Cairo','Noto Sans Arabic',system-ui,sans-serif; }
.wf-glow { position: absolute; top: 0; left: 0; right: 0; height: 60%; background: radial-gradient(circle at 70% 20%, rgba(255,60,172,.35), transparent 55%), radial-gradient(circle at 20% 40%, rgba(43,210,255,.28), transparent 50%); pointer-events: none; }
.wf-app { position: relative; max-width: 480px; margin: 0 auto; padding: 18px 16px 40px; box-sizing: border-box; }
.wf-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.wf-title { font-size: 28px; font-weight: 800; background: linear-gradient(90deg,#ff3cac,#2bd2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wf-round { font-size: 14px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.1); }
.wf-section { display: flex; flex-direction: column; gap: 14px; }
.wf-lead { margin: 0; font-size: 16px; line-height: 1.7; color: #d9ccf5; }
.wf-center { text-align: center; }
.wf-hint { margin: 0; font-size: 13px; color: #a898c9; }
.wf-add { display: flex; gap: 8px; }
.wf-input { flex: 1; min-width: 0; height: 48px; border-radius: 14px; border: 2px solid #4c3a85; background: #1d1240; color: #fff; padding: 0 14px; font-size: 18px; font-family: inherit; }
.wf-input:focus { outline: none; border-color: #2bd2ff; }
.wf-chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 8px; }
.wf-chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #2bd2ff; background: rgba(43,210,255,.12); color: #fff; font-size: 16px; font-family: inherit; cursor: pointer; }
.wf-btn { min-height: 54px; border: 0; border-radius: 16px; font-size: 18px; font-weight: 700; font-family: inherit; color: #fff; cursor: pointer; background: linear-gradient(90deg,#ff3cac,#784ba0 60%,#2b86c5); box-shadow: 0 6px 24px rgba(255,60,172,.35); padding: 0 18px; }
.wf-btn:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; }
.wf-btn-small { min-height: 48px; font-size: 16px; }
.wf-btn-ghost { background: transparent; border: 2px solid #4c3a85; box-shadow: none; color: #d9ccf5; }
.wf-question { padding: 26px 18px; border-radius: 22px; background: linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.2); font-size: 24px; line-height: 1.6; font-weight: 800; text-align: center; }
.wf-question-small { font-size: 19px; padding: 18px 16px; }
.wf-timer { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.wf-timer-num { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 52px; font-weight: 800; border: 4px solid #2bd2ff; box-shadow: 0 0 28px rgba(43,210,255,.6); }
.wf-timer-bar { width: 100%; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); }
.wf-timer-fill { height: 100%; background: linear-gradient(90deg,#ff3cac,#2bd2ff); transition: width 1s linear; }
.wf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wf-card { position: relative; border-radius: 18px; background: #1d1240; border: 2px solid #3b2c70; }
.wf-card.is-voted { border-color: #ff3cac; background: linear-gradient(160deg,rgba(255,60,172,.28),#1d1240); box-shadow: 0 0 18px rgba(255,60,172,.4); }
.wf-card-main { width: 100%; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 8px; background: none; border: 0; color: #fff; font-family: inherit; cursor: pointer; }
.wf-avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 800; background: linear-gradient(135deg,#2bd2ff,#784ba0); }
.wf-name { font-size: 18px; font-weight: 700; word-break: break-word; }
.wf-count { font-size: 22px; font-weight: 800; color: #ffd166; }
.wf-minus { position: absolute; top: 6px; inset-inline-start: 6px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 24px; cursor: pointer; }
.wf-winner { text-align: center; padding: 22px 12px; border-radius: 22px; background: radial-gradient(circle at 50% 0,rgba(255,209,102,.3),rgba(255,255,255,.05)); border: 1px solid rgba(255,209,102,.5); }
.wf-crown { font-size: 44px; }
.wf-win-name { font-size: 44px; font-weight: 800; color: #ffd166; line-height: 1.3; }
.wf-win-multi { font-size: 30px; }
.wf-win-line { margin-top: 6px; font-size: 18px; color: #f1e8ff; }
.wf-bars { display: flex; flex-direction: column; gap: 10px; }
.wf-bar-row { display: grid; grid-template-columns: 84px 1fr 28px; align-items: center; gap: 10px; font-size: 16px; }
.wf-bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf-bar-track { height: 14px; border-radius: 8px; background: rgba(255,255,255,.1); overflow: hidden; display: block; }
.wf-bar-fill { display: block; height: 100%; background: linear-gradient(90deg,#ff3cac,#2bd2ff); border-radius: 8px; transition: width .4s; }
.wf-bar-n { font-weight: 800; text-align: center; }

.wf-app{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom))}

 var root=document.getElementById('root'); root.innerHTML=h;
 var inp=document.getElementById('in'); if(inp&&keepFocus)inp.focus();
}
document.addEventListener('input',function(e){if(e.target.id==='in')S.draft=e.target.value});

 if(a==='add'){var inp=document.getElementById('in');if(inp)S.draft=inp.value;addP()}
 else if(a==='rm'){S.players.splice(i,1);render()}
 else if(a==='start')start(); else if(a==='tally')tally(); else if(a==='bump')bump(i,1); else if(a==='minus')bump(i,-1);
 else if(a==='result')result(); else if(a==='next')next(); else if(a==='final'){S.phase='final';render()}
